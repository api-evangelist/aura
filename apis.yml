name: Aura
description: 'Aura is an all-in-one consumer digital-safety company that protects individuals
  and families from identity theft, financial fraud, scams, and online threats. Its subscription
  service bundles credit and identity monitoring with up to millions in identity-theft insurance,
  suspicious-transaction alerts, dark-web monitoring, a privacy assistant that removes personal
  data from data brokers, parental controls and safe-gaming alerts, an encrypted vault and password
  manager, spam-call protection, a VPN, and antivirus. Aura is a direct-to-consumer product with no
  public developer API; this profile captures its identity, security posture, and compliance surface.
  Backed by Accel, Cowboy Ventures, General Catalyst, and Partech.'
